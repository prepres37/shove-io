<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shove.io — Мемная Битва</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #09070f;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #ui {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 20px;
            background: rgba(23, 20, 38, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* Окно магазина скинов */
        #shop-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: #ff007f;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
        }
        #shop-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: #171426;
            border: 3px solid #00ffcc;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
        }
        .skin-option {
            background: #25213b;
            border: 2px solid #4a2574;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .skin-btn {
            background: #00ffcc;
            border: none;
            color: #000;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .skin-btn.equipped { background: #ff007f; color: #fff; }
        #close-shop {
            margin-top: 15px;
            background: #555;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Враги: <span id="enemiesCount">5</span> 👾</div>
        <div>Монеты: <span id="coins">0</span> 💰</div>
    </div>

    <button id="shop-btn">🏪 Магазин Скинов</button>

    <div id="shop-modal">
        <h3>Выбери мем-скин</h3>
        <div id="skins-list"></div>
        <button id="close-shop">Закрыть</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const enemiesUI = document.getElementById("enemiesCount");
        const coinsUI = document.getElementById("coins");
        const shopBtn = document.getElementById("shop-btn");
        const shopModal = document.getElementById("shop-modal");
        const closeShop = document.getElementById("close-shop");
        const skinsList = document.getElementById("skins-list");

        // Размеры игрового мира
        const world = { width: 1200, height: 1200 };
        const arena = { x: 600, y: 600, radius: 450 };
        
        let coins = parseInt(localStorage.getItem('shove_coins')) || 0;
        coinsUI.innerText = coins;

        let targetX = arena.x;
        let targetY = arena.y;
        let isTouching = false;

        // База скинов для монетизации
        const skins = [
            { id: 'default', name: '🟢 Огурец', color: '#00ffcc', price: 0, emoji: '🟢' },
            { id: 'capybara', name: '🦫 Капибара', color: '#b5895a', price: 50, emoji: '🦫' },
            { id: 'floppa', name: '🐈 Шлёпа', color: '#ffaa44', price: 120, emoji: '🐈' },
            { id: 'anon', name: '🎭 Анонимус', color: '#ffffff', price: 250, emoji: '🎭' }
        ];
        let ownedSkins = JSON.parse(localStorage.getItem('shove_owned_skins')) || ['default'];
        let currentSkin = localStorage.getItem('shove_current_skin') || 'default';

        class Entity {
            constructor(x, y, radius, skinId, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.isPlayer = isPlayer;
                this.skinId = skinId;
                this.vx = 0;
                this.vy = 0;
                this.mass = radius;
                this.alive = true;
            }

            getSkin() {
                return skins.find(s => s.id === this.skinId) || skins[0];
            }

            update() {
                if (!this.alive) return;

                if (this.isPlayer) {
                    if (isTouching) {
                        let dx = targetX - this.x;
                        let dy = targetY - this.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 5) {
                            // Ограничение максимальной скорости следования за пальцем
                            let speed = Math.min(dist * 0.1, 6);
                            this.vx += (dx / dist) * speed * 0.15;
                            this.vy += (dy / dist) * speed * 0.15;
                        }
                    }
                } else {
                    // ИИ ботов: бегут к центру, если близко к краю, или атакуют игрока
                    let toPlayerX = player.x - this.x;
                    let toPlayerY = player.y - this.y;
                    let distToPlayer = Math.sqrt(toPlayerX * toPlayerX + toPlayerY * toPlayerY);

                    if (distToPlayer < 250 && player.alive) {
                        this.vx += (toPlayerX / distToPlayer) * 0.2;
                        this.vy += (toPlayerY / distToPlayer) * 0.2;
                    } else if (Math.random() < 0.02) {
                        this.vx += (Math.random() - 0.5) * 3;
                        this.vy += (Math.random() - 0.5) * 3;
                    }
                }

                this.vx *= 0.94;
                this.vy *= 0.94;
                this.x += this.vx;
                this.y += this.vy;

                // Проверка вылета за круглую арену
                let distToCenter = Math.sqrt((this.x - arena.x)**2 + (this.y - arena.y)**2);
                if (distToCenter > arena.radius) {
                    this.alive = false;
                    if (!this.isPlayer) {
                        coins += 10;
                        localStorage.setItem('shove_coins', coins);
                        coinsUI.innerText = coins;
                        updateShopUI();
                    } else {
                        setTimeout(() => { resetGame(); }, 1000);
                    }
                }
            }

            draw(camX, camY) {
                if (!this.alive) return;
                let s = this.getSkin();
                
                ctx.save();
                ctx.translate(this.x - camX, this.y - camY);
                
                // Тело кружка
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.fill();
                ctx.shadowColor = s.color;
                ctx.shadowBlur = 10;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();

                // Рисуем эмодзи-мордочку мем-персонажа внутри
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000';
                ctx.font = `${this.radius * 1.2}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(s.emoji, 0, 0);
                
                ctx.restore();
            }
        }

        let player;
        let entities = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function resetGame() {
            player = new Entity(arena.x, arena.y, 25, currentSkin, true);
            entities = [player];
            
            // Спавним случайных ботов-врагов в мемных скинах
            const enemySkins = ['capybara', 'floppa', 'anon', 'default'];
            for (let i = 0; i < 6; i++) {
                let randomSkin = enemySkins[Math.floor(Math.random() * enemySkins.length)];
                let angle = Math.random() * Math.PI * 2;
                let r = Math.random() * (arena.radius - 100);
                entities.push(new Entity(
                    arena.x + Math.cos(angle) * r,
                    arena.y + Math.sin(angle) * r,
                    23,
                    randomSkin
                ));
            }
        }

        // Физика столкновений импульсов (отскоки)
        function handleCollisions() {
            for (let i = 0; i < entities.length; i++) {
                for (let j = i + 1; j < entities.length; j++) {

                let e1 = entities[i];
let e2 = entities[j];
if (!e1.alive || !e2.alive) continue;
let dx = e2.x - e1.x;
let dy = e2.y - e1.y;
let dist = Math.sqrt(dx * dx + dy * dy);
if (dist < e1.radius + e2.radius) {
let overlap = (e1.radius + e2.radius) - dist;
let nx = dx / dist;
let ny = dy / dist;
e1.x -= nx * overlap * 0.5;
e1.y -= ny * overlap * 0.5;
let kx = e1.vx - e2.vx;
let ky = e1.vy - e2.vy;
let p = 2 * (nx * kx + ny * ky) / (e1.mass + e2.mass);
// Сильный отскок
e1.vx -= p * e2.mass * nx * 2.2;
e1.vy -= p * e2.mass * ny * 2.2;
e2.vx += p * e1.mass * nx * 2.2;
e2.vy += p * e1.mass * ny * 2.2;
}
}
}
}
// --- Обработка Тачскрина и Мыши ---
function updateTargetPos(clientX, clientY) {
let camX = player.x - canvas.width / 2;
let camY = player.y - canvas.height / 2;
targetX = clientX + camX;
targetY = clientY + camY;
}
window.addEventListener('mousedown', (e) => { isTouching = true; updateTargetPos(e.clientX, e.clientY); });
window.addEventListener('mousemove', (e) => { if (isTouching) updateTargetPos(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { isTouching = false; });
window.addEventListener('touchstart', (e) => { isTouching = true; updateTargetPos(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
window.addEventListener('touchmove', (e) => { if (isTouching) updateTargetPos(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
window.addEventListener('touchend', () => { isTouching = false; });
// --- Магазин Скинов ---
function updateShopUI() {
skinsList.innerHTML = '';
skins.forEach(skin => {
let div = document.createElement('div');
div.className = 'skin-option';
let isOwned = ownedSkins.includes(skin.id);
let isEquipped = currentSkin === skin.id;
let btnText = isEquipped ? 'Надет' : (isOwned ? 'Надеть' : ${skin.price} 💰);
let btnClass = isEquipped ? 'skin-btn equipped' : 'skin-btn';
div.innerHTML = <span>${skin.name}</span>;
let btn = document.createElement('button');
btn.className = btnClass;
btn.innerText = btnText;
btn.onclick = () => {
if (isOwned) {
currentSkin = skin.id;
localStorage.setItem('shove_current_skin', currentSkin);
player.skinId = currentSkin;
updateShopUI();
} else if (coins >= skin.price) {
coins -= skin.price;
localStorage.setItem('shove_coins', coins);
coinsUI.innerText = coins;
ownedSkins.push(skin.id);
localStorage.setItem('shove_owned_skins', JSON.stringify(ownedSkins));
currentSkin = skin.id;
localStorage.setItem('shove_current_skin', currentSkin);
player.skinId = currentSkin;
updateShopUI();
} else {
alert("Не хватает монет! Выбивайте ботов с арены!");
}
};
div.appendChild(btn);
skinsList.appendChild(div);
});
}
shopBtn.onclick = () => { shopModal.style.display = 'block'; updateShopUI(); };
closeShop.onclick = () => { shopModal.style.display = 'none'; };
// Игровой цикл
function gameLoop() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
// Камера плавно следует за игроком
let camX = player.x - canvas.width / 2;
let camY = player.y - canvas.height / 2;
// Сетка космоса (фона)
ctx.strokeStyle = '#1b1730';
ctx.lineWidth = 1;
let gridSize = 50;
for (let x = Math.floor(camX / gridSize) * gridSize; x < camX + canvas.width; x += gridSize) {
ctx.beginPath(); ctx.moveTo(x - camX, 0); ctx.lineTo(x - camX, canvas.height); ctx.stroke();
}
for (let y = Math.floor(camY / gridSize) * gridSize; y < camY + canvas.height; y += gridSize) {
ctx.beginPath(); ctx.moveTo(0, y - camY); ctx.lineTo(canvas.width, y - camY); ctx.stroke();
}
// Рисуем опасную неоновую арену
ctx.beginPath();
ctx.arc(arena.x - camX, arena.y - camY, arena.radius, 0, Math.PI * 2);
ctx.fillStyle = "#110e21";
ctx.fill();
ctx.lineWidth = 8;
ctx.strokeStyle = "#ff007f";
ctx.stroke();
// Обновляем сущности
let aliveEnemies = 0;
entities.forEach(e => {
e.update();
e.draw(camX, camY);
if (!e.isPlayer && e.alive) aliveEnemies++;
});
handleCollisions();
enemiesUI.innerText = aliveEnemies;
if (aliveEnemies === 0 && player.alive) {
alert("Победа! Вы выкинули всех!");
resetGame();
}
requestAnimationFrame(gameLoop);
}
resetGame();
gameLoop();
